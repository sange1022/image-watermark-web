appId: com.xuwuyingzao.watermark
productName: 戌無营造的剃刀-水印
copyright: Copyright © 2026 戌無营造
asar: true
directories:
  output: desktop-release
files:
  - dist/**/*
  - desktop/main.cjs
  - desktop/preload.cjs
  - desktop/app.ico
  - package.json
  - '!node_modules/**/*'
win:
  target:
    - target: nsis
      arch: [x64]
  icon: desktop/app.ico
  executableName: Watermark
  artifactName: Watermark-Setup-${version}-win10-x64.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 戌無营造的剃刀-水印
  installerLanguages: [zh_CN, en_US]
  language: '2052'
  deleteAppDataOnUninstall: false
